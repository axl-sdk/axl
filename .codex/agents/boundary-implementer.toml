name = "boundary-implementer"
description = "Use this Terra/high agent for bounded, settled implementation at consequential Axl seams: public Zod/types, structured output, provider request/response mapping, streaming/events/redaction, state durability and suspend/resume, usage/cost accounting, and concurrency-sensitive orchestration. The lead must supply design, invariants, acceptance criteria, and verification; every diff requires a focused adversarial-code-reviewer pass."
model = "gpt-5.6-terra"
